; Scrutiny Debugger - ESP32 Arduino PlatformIO Demo
; https://github.com/scrutinydebugger/scrutiny-demos

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -Iinclude
    -gdwarf-4
extra_scripts = pre:scrutiny_postbuild.py
monitor_speed = 115200

; Uncomment to manually specify upload port if auto-detection fails:
; upload_port = COM7
; monitor_port = COM7
